<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Week's Case — Case Cracker Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink-navy: #16233D;
    --parchment: #F3E9D2;
    --parchment-dim: #E9DBB8;
    --brass: #C89B3C;
    --brass-light: #E0BC6C;
    --clue-red: #A63D40;
    --forest-teal: #2F5D50;
    --font-display: 'Special Elite', monospace;
    --font-body: 'Quicksand', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--parchment);
    color: var(--ink-navy);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }
  .logo { font-family: var(--font-display); font-size: 1.1rem; }
  .back-link { color: var(--ink-navy); font-size: 0.9rem; text-decoration: none; font-weight: 600; }

  .who-picker {
    background: white;
    border: 1.5px solid rgba(22,35,61,0.12);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .who-picker label { font-weight: 700; display: block; margin-bottom: 10px; }
  select#child-select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1.5px solid rgba(22,35,61,0.2);
    font-family: var(--font-body);
    font-size: 1rem;
  }

  .case-card {
    background: var(--ink-navy);
    color: var(--parchment);
    border-radius: 14px;
    padding: 40px;
  }
  .case-label {
    font-family: var(--font-display);
    color: var(--brass-light);
    font-size: 0.85rem;
    margin-bottom: 10px;
  }
  .case-card h1 {
    font-family: var(--font-display);
    font-size: 1.6rem;
    margin-bottom: 20px;
    line-height: 1.3;
  }
  .case-card p.intro {
    color: var(--parchment-dim);
    margin-bottom: 28px;
    font-size: 1.02rem;
  }

  .clue {
    background: rgba(243,233,210,0.06);
    border-left: 3px solid var(--brass);
    padding: 14px 18px;
    margin-bottom: 14px;
    border-radius: 4px;
  }
  .clue-tag {
    font-family: var(--font-display);
    color: var(--brass-light);
    font-size: 0.75rem;
    margin-bottom: 6px;
    display: block;
  }

  .riddle-box {
    margin-top: 32px;
    padding-top: 28px;
    border-top: 1px solid rgba(243,233,210,0.15);
  }
  .riddle-box h2 {
    font-family: var(--font-display);
    font-size: 1.1rem;
    margin-bottom: 16px;
  }
  input#answer-input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid rgba(243,233,210,0.25);
    background: rgba(243,233,210,0.08);
    color: var(--parchment);
    font-family: var(--font-body);
    font-size: 1rem;
    margin-bottom: 16px;
  }
  input#answer-input::placeholder { color: rgba(243,233,210,0.4); }

  button#submit-answer {
    background: var(--brass);
    color: var(--ink-navy);
    border: none;
    padding: 14px 26px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    width: 100%;
  }

  #result-message {
    margin-top: 18px;
    padding: 16px;
    border-radius: 8px;
    display: none;
    font-weight: 600;
  }
  #result-message.correct { background: rgba(47,93,80,0.35); color: #CFEFE1; display: block; }
  #result-message.wrong { background: rgba(166,61,64,0.3); color: #F5D2D3; display: block; }
  #result-message.already { background: rgba(200,155,60,0.25); color: var(--brass-light); display: block; }

  .empty-state {
    background: white;
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    color: #6B7690;
  }
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <div class="logo">🕵️ Case Cracker Club</div>
    <a href="dashboard.html" class="back-link">← Dashboard</a>
  </nav>

  <div class="who-picker" id="who-picker" style="display:none;">
    <label for="child-select">Who's solving this case?</label>
    <select id="child-select"></select>
  </div>

  <div id="case-container">
    <div class="empty-state">Loading this week's case...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://leqmwwaasqrigppyaboc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_bnJq86HNYfwmiVrDKsfs0g_VwQU6lx5";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let currentCase = null;
  let children = [];

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = "signup.html";
      return;
    }
    currentUser = session.user;

    const [caseResult, childrenResult] = await Promise.all([
      supabaseClient.from("cases").select("*").eq("active", true).order("created_at", { ascending: false }).limit(1).single(),
      supabaseClient.from("children").select("*").eq("parent_id", currentUser.id).order("created_at", { ascending: true })
    ]);

    if (childrenResult.data && childrenResult.data.length > 0) {
      children = childrenResult.data;
      const select = document.getElementById("child-select");
      select.innerHTML = children.map(c => `<option value="${c.id}">${c.avatar_emoji} ${escapeHtml(c.codename)}</option>`).join("");
      document.getElementById("who-picker").style.display = "block";
    }

    if (caseResult.error || !caseResult.data) {
      document.getElementById("case-container").innerHTML = '<div class="empty-state">No case is live right now — check back Monday!</div>';
      return;
    }

    currentCase = caseResult.data;
    renderCase(currentCase);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderCase(c) {
    document.getElementById("case-container").innerHTML = `
      <div class="case-card">
        <div class="case-label">THIS WEEK'S CASE</div>
        <h1>${escapeHtml(c.title)}</h1>
        <p class="intro">${escapeHtml(c.story_intro)}</p>

        <div class="clue"><span class="clue-tag">CLUE #1</span>${escapeHtml(c.clue1)}</div>
        <div class="clue"><span class="clue-tag">CLUE #2</span>${escapeHtml(c.clue2)}</div>
        <div class="clue"><span class="clue-tag">CLUE #3</span>${escapeHtml(c.clue3)}</div>

        <div class="riddle-box">
          <h2>${escapeHtml(c.riddle_question)}</h2>
          <input type="text" id="answer-input" placeholder="Type your answer...">
          <button id="submit-answer">Submit Answer</button>
          <div id="result-message"></div>
        </div>
      </div>
    `;
    document.getElementById("submit-answer").addEventListener("click", handleSubmit);
  }

  async function handleSubmit() {
    const select = document.getElementById("child-select");
    const messageEl = document.getElementById("result-message");
    const answerInput = document.getElementById("answer-input");

    if (children.length === 0) {
      messageEl.className = "wrong";
      messageEl.textContent = "Add a kid profile on the dashboard first!";
      return;
    }

    const childId = select.value;
    const answer = answerInput.value.trim().toLowerCase();
    const correctAnswer = currentCase.riddle_answer.trim().toLowerCase();

    if (!answer) return;

    if (answer !== correctAnswer) {
      messageEl.className = "wrong";
      messageEl.textContent = "Not quite — take another look at the clues!";
      return;
    }

    const { error: insertError } = await supabaseClient.from("solved_cases").insert({
      child_id: childId,
      case_id: currentCase.id
    });

    if (insertError) {
      if (insertError.code === "23505") {
        messageEl.className = "already";
        messageEl.textContent = "This detective already solved this case!";
      } else {
        messageEl.className = "wrong";
        messageEl.textContent = "Something went wrong: " + insertError.message;
      }
      return;
    }

    const child = children.find(c => c.id === childId);
    await supabaseClient.from("children").update({ points: (child.points || 0) + 10 }).eq("id", childId);
    child.points = (child.points || 0) + 10;

    messageEl.className = "correct";
    messageEl.textContent = `${currentCase.badge_emoji} Case solved! +10 points for ${child.codename}.`;
  }

  init();
</script>

</body>
</html>
