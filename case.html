<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Week's Case — Case Cracker Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink-navy: #16233D;
    --parchment: #F3E9D2;
    --parchment-dim: #E9DBB8;
    --brass: #C89B3C;
    --brass-light: #E0BC6C;
    --clue-red: #A63D40;
    --forest-teal: #2F5D50;
    --font-display: 'Special Elite', monospace;
    --font-body: 'Quicksand', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--parchment);
    color: var(--ink-navy);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }
  .logo { font-family: var(--font-display); font-size: 1.1rem; }
  .back-link { color: var(--ink-navy); font-size: 0.9rem; text-decoration: none; font-weight: 600; }

  .who-picker {
    background: white;
    border: 1.5px solid rgba(22,35,61,0.12);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .who-picker label { font-weight: 700; display: block; margin-bottom: 10px; }
  select#child-select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1.5px solid rgba(22,35,61,0.2);
    font-family: var(--font-body);
    font-size: 1rem;
  }

  .progress {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .progress-dot {
    flex: 1;
    height: 6px;
    border-radius: 4px;
    background: rgba(22,35,61,0.15);
  }
  .progress-dot.done { background: var(--forest-teal); }
  .progress-dot.current { background: var(--brass); }

  .case-card {
    background: var(--ink-navy);
    color: var(--parchment);
    border-radius: 14px;
    padding: 40px;
  }
  .case-label {
    font-family: var(--font-display);
    color: var(--brass-light);
    font-size: 0.85rem;
    margin-bottom: 10px;
  }
  .case-card h1 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    margin-bottom: 18px;
    line-height: 1.3;
  }
  .case-card p.intro {
    color: var(--parchment-dim);
    margin-bottom: 24px;
    font-size: 1.02rem;
  }

  .stage-tag {
    font-family: var(--font-display);
    color: var(--brass-light);
    font-size: 0.8rem;
    margin-bottom: 10px;
  }

  .clue {
    background: rgba(243,233,210,0.06);
    border-left: 3px solid var(--brass);
    padding: 16px 18px;
    margin-bottom: 24px;
    border-radius: 4px;
    font-size: 1.02rem;
  }

  .question-text {
    font-family: var(--font-display);
    font-size: 1.1rem;
    margin-bottom: 18px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }

  .option-btn {
    text-align: left;
    background: rgba(243,233,210,0.08);
    border: 1.5px solid rgba(243,233,210,0.2);
    color: var(--parchment);
    padding: 14px 16px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 0.98rem;
    cursor: pointer;
  }
  .option-btn:hover { background: rgba(243,233,210,0.15); }
  .option-btn.correct { border-color: var(--forest-teal); background: rgba(47,93,80,0.35); }
  .option-btn.incorrect { border-color: var(--clue-red); background: rgba(166,61,64,0.3); }
  .option-btn:disabled { cursor: default; }

  #result-message {
    margin-top: 18px;
    padding: 16px;
    border-radius: 8px;
    display: none;
    font-weight: 600;
  }
  #result-message.correct { background: rgba(47,93,80,0.35); color: #CFEFE1; display: block; }
  #result-message.wrong { background: rgba(166,61,64,0.3); color: #F5D2D3; display: block; }
  #result-message.already { background: rgba(200,155,60,0.25); color: var(--brass-light); display: block; }
  #result-message.finished { background: rgba(47,93,80,0.35); color: #CFEFE1; display: block; }

  .empty-state {
    background: white;
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    color: #6B7690;
  }

  .reveal-card {
    background: var(--ink-navy);
    color: var(--parchment);
    border-radius: 14px;
    padding: 44px;
  }
  .reveal-badge { font-size: 2.4rem; margin-bottom: 14px; }
  .reveal-label {
    font-family: var(--font-display);
    color: var(--brass-light);
    font-size: 0.85rem;
    margin-bottom: 10px;
  }
  .reveal-card h1 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    margin-bottom: 20px;
  }
  .reveal-story {
    background: rgba(243,233,210,0.06);
    border-left: 3px solid var(--forest-teal);
    padding: 18px 20px;
    border-radius: 4px;
    line-height: 1.7;
    margin-bottom: 24px;
  }
  .reveal-points {
    font-family: var(--font-display);
    color: var(--brass-light);
    font-size: 1rem;
    margin-bottom: 28px;
  }
  .reveal-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .reveal-btn {
    background: var(--brass);
    color: var(--ink-navy);
    padding: 12px 22px;
    border-radius: 8px;
    font-weight: 700;
    text-decoration: none;
    font-size: 0.95rem;
  }
  .reveal-btn.secondary {
    background: transparent;
    color: var(--parchment);
    border: 1.5px solid rgba(243,233,210,0.3);
  }
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <div class="logo">🕵️ Case Cracker Club</div>
    <div style="display:flex; gap:14px; align-items:center;">
      <a href="depository.html" class="back-link">Depository</a>
      <a href="dashboard.html" class="back-link">← Dashboard</a>
    </div>
  </nav>

  <div class="who-picker" id="who-picker" style="display:none;">
    <label for="child-select">Who's solving this case?</label>
    <select id="child-select"></select>
  </div>

  <div id="case-container">
    <div class="empty-state">Loading this week's case...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://leqmwwaasqrigppyaboc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_bnJq86HNYfwmiVrDKsfs0g_VwQU6lx5";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const POINTS_PER_STAGE = 10;

  let currentUser = null;
  let currentCase = null;
  let stages = [];
  let children = [];
  let stageIndex = 0;
  let answeredCorrectly = false;
  let isArchive = false;

  function getArchiveIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id");
  }

  async function init() {
    const archiveId = getArchiveIdFromUrl();
    isArchive = !!archiveId;

    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session && !isArchive) {
      window.location.href = "signup.html";
      return;
    }
    currentUser = session ? session.user : null;

    let caseResult, childrenResult;

    if (isArchive) {
      caseResult = await supabaseClient.from("cases").select("*").eq("id", archiveId).single();
      childrenResult = currentUser
        ? await supabaseClient.from("children").select("*").eq("parent_id", currentUser.id).order("created_at", { ascending: true })
        : { data: [] };
    } else {
      const today = new Date().toISOString().slice(0, 10);
      [caseResult, childrenResult] = await Promise.all([
        supabaseClient.from("cases").select("*").lte("week_start_date", today).order("week_start_date", { ascending: false }).limit(1).single(),
        supabaseClient.from("children").select("*").eq("parent_id", currentUser.id).order("created_at", { ascending: true })
      ]);
    }

    if (childrenResult.data && childrenResult.data.length > 0) {
      children = childrenResult.data;
      const select = document.getElementById("child-select");
      select.innerHTML = children.map(c => `<option value="${c.id}">${c.avatar_emoji} ${escapeHtml(c.codename)}</option>`).join("");
      if (!isArchive) {
        document.getElementById("who-picker").style.display = "block";
      }
    }

    if (caseResult.error || !caseResult.data) {
      document.getElementById("case-container").innerHTML = '<div class="empty-state">No case is live right now — check back Monday!</div>';
      return;
    }

    currentCase = caseResult.data;

    const stagesResult = await supabaseClient
      .from("case_stages")
      .select("*")
      .eq("case_id", currentCase.id)
      .order("stage_number", { ascending: true });

    if (stagesResult.error || !stagesResult.data || stagesResult.data.length === 0) {
      document.getElementById("case-container").innerHTML = '<div class="empty-state">This case has no stages yet.</div>';
      return;
    }

    stages = stagesResult.data;
    renderStage();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderProgress() {
    return `
      <div class="progress">
        ${stages.map((s, i) => `
          <div class="progress-dot ${i < stageIndex ? 'done' : (i === stageIndex ? 'current' : '')}"></div>
        `).join("")}
      </div>
    `;
  }

  function renderStage() {
    const stage = stages[stageIndex];
    answeredCorrectly = false;

    const options = [
      { key: "a", text: stage.option_a },
      { key: "b", text: stage.option_b },
      { key: "c", text: stage.option_c },
      { key: "d", text: stage.option_d }
    ];

    document.getElementById("case-container").innerHTML = `
      <div class="case-card">
        <div class="case-label">${isArchive ? "FROM THE DEPOSITORY" : "THIS WEEK'S CASE"}</div>
        <h1>${escapeHtml(currentCase.title)}</h1>
        ${stageIndex === 0 ? `<p class="intro">${escapeHtml(currentCase.story_intro)}</p>` : ""}

        ${renderProgress()}

        <div class="stage-tag">STAGE ${stageIndex + 1} OF ${stages.length}</div>
        <div class="clue">${escapeHtml(stage.clue_text)}</div>

        <div class="question-text">${escapeHtml(stage.question)}</div>
        <div class="options" id="options-list">
          ${options.map(o => `
            <button class="option-btn" data-key="${o.key}">${escapeHtml(o.text)}</button>
          `).join("")}
        </div>

        <div id="result-message"></div>
      </div>
    `;

    document.querySelectorAll(".option-btn").forEach(btn => {
      btn.addEventListener("click", () => handleOptionClick(btn, stage));
    });
  }

  function handleOptionClick(btn, stage) {
    if (answeredCorrectly) return;

    const allButtons = document.querySelectorAll(".option-btn");
    const chosenKey = btn.dataset.key;
    const messageEl = document.getElementById("result-message");

    if (chosenKey === stage.correct_option) {
      answeredCorrectly = true;
      allButtons.forEach(b => b.disabled = true);
      btn.classList.add("correct");

      const isLastStage = stageIndex === stages.length - 1;

      if (isLastStage) {
        finishCase(messageEl);
      } else {
        messageEl.className = "correct";
        messageEl.textContent = "Correct! Moving to the next clue...";
        setTimeout(() => {
          stageIndex++;
          renderStage();
        }, 1200);
      }
    } else {
      btn.classList.add("incorrect");
      btn.disabled = true;
      messageEl.className = "wrong";
      messageEl.textContent = "Not quite — try one of the other options.";
    }
  }

  async function finishCase(messageEl) {
    if (isArchive) {
      sessionStorage.setItem("caseAchievement", JSON.stringify({
        badge: currentCase.badge_emoji,
        title: currentCase.title,
        resolution: currentCase.resolution_text,
        points: 0,
        codename: "Detective",
        alreadySolved: true
      }));
      window.location.href = "achievement.html";
      return;
    }

    const select = document.getElementById("child-select");

    if (children.length === 0) {
      messageEl.className = "wrong";
      messageEl.textContent = "Add a kid profile on the dashboard first, then come back to save this win!";
      return;
    }

    const childId = select.value;
    const totalPoints = POINTS_PER_STAGE * stages.length;
    const child = children.find(c => c.id === childId);

    const { error: insertError } = await supabaseClient.from("solved_cases").insert({
      child_id: childId,
      case_id: currentCase.id
    });

    let alreadySolved = false;
    let pointsEarned = totalPoints;

    if (insertError) {
      if (insertError.code === "23505") {
        alreadySolved = true;
        pointsEarned = 0;
      } else {
        messageEl.className = "wrong";
        messageEl.textContent = "Something went wrong: " + insertError.message;
        return;
      }
    } else {
      await supabaseClient.from("children").update({ points: (child.points || 0) + totalPoints }).eq("id", childId);
    }

    sessionStorage.setItem("caseAchievement", JSON.stringify({
      badge: currentCase.badge_emoji,
      title: currentCase.title,
      resolution: currentCase.resolution_text,
      points: pointsEarned,
      codename: child.codename,
      alreadySolved: alreadySolved
    }));

    window.location.href = "achievement.html";
  }

  init();
</script>

</body>
</html>
