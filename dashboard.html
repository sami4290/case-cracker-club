<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Dashboard — Case Cracker Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="avatar-render.js?v=4"></script>
<style>
  :root {
    --ink-navy: #16233D;
    --parchment: #F3E9D2;
    --parchment-dim: #E9DBB8;
    --brass: #C89B3C;
    --brass-light: #E0BC6C;
    --clue-red: #A63D40;
    --forest-teal: #2F5D50;
    --font-display: 'Special Elite', monospace;
    --font-body: 'Quicksand', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--parchment);
    color: var(--ink-navy);
    min-height: 100vh;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 40px 24px 80px; }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
  }
  .logo {
    font-family: var(--font-display);
    font-size: 1.1rem;
  }
  .nav-links { display: flex; gap: 16px; align-items: center; }
  .nav-links a {
    color: var(--ink-navy);
    font-weight: 700;
    text-decoration: none;
    font-size: 0.9rem;
  }
  .logout {
    background: transparent;
    border: 1.5px solid var(--ink-navy);
    color: var(--ink-navy);
    padding: 8px 16px;
    border-radius: 6px;
    font-family: var(--font-body);
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
  }

  h1 { font-family: var(--font-display); font-size: 1.7rem; margin-bottom: 6px; }
  p.sub { color: #3B4A63; margin-bottom: 24px; }

  .case-banner {
    background: var(--ink-navy);
    border-radius: 14px;
    padding: 26px 28px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .case-banner .case-label {
    font-family: var(--font-display);
    color: var(--brass-light);
    font-size: 0.8rem;
    margin-bottom: 8px;
  }
  .case-banner h2 {
    font-family: var(--font-display);
    color: var(--parchment);
    font-size: 1.15rem;
    line-height: 1.4;
  }
  .case-banner .badge-emoji { font-size: 1.8rem; margin-right: 8px; }
  .case-banner .btn-solve {
    background: var(--brass);
    color: var(--ink-navy);
    padding: 12px 22px;
    border-radius: 8px;
    font-weight: 700;
    text-decoration: none;
    font-size: 0.92rem;
    white-space: nowrap;
  }

  .stats-row {
    display: flex;
    gap: 14px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: white;
    border: 1.5px solid rgba(22,35,61,0.12);
    border-radius: 10px;
    padding: 14px 20px;
    flex: 1;
    min-width: 130px;
  }
  .stat-pill .stat-value {
    font-family: var(--font-display);
    font-size: 1.4rem;
    color: var(--brass);
  }
  .stat-pill .stat-label {
    font-size: 0.8rem;
    color: #6B7690;
    font-weight: 600;
  }

  .card {
    background: white;
    border: 1.5px solid rgba(22,35,61,0.12);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 24px;
  }

  .card h2 {
    font-family: var(--font-display);
    font-size: 1.1rem;
    margin-bottom: 18px;
  }

  .child-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-bottom: 10px;
  }
  @media (min-width: 560px) {
    .child-grid { grid-template-columns: 1fr 1fr; }
  }

  .child-card {
    border: 1.5px solid rgba(22,35,61,0.1);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--parchment);
  }
  .child-card .avatar {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--forest-teal);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    overflow: hidden;
    flex-shrink: 0;
  }
  .child-card .child-info { flex: 1; min-width: 0; }
  .child-card .codename { font-weight: 700; font-size: 1.02rem; }
  .child-card .child-stats {
    display: flex;
    gap: 10px;
    margin-top: 4px;
    font-size: 0.8rem;
    color: #6B7690;
  }
  .child-card .child-stats .points-val { color: var(--brass); font-weight: 700; }
  .child-card .edit-btn {
    background: transparent;
    border: 1.5px solid rgba(22,35,61,0.2);
    color: var(--ink-navy);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    flex-shrink: 0;
  }

  .empty-state { color: #6B7690; font-size: 0.95rem; padding: 12px 0; }

  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .avatar-option {
    aspect-ratio: 1;
    border-radius: 10px;
    border: 2px solid rgba(22,35,61,0.15);
    background: white;
    font-size: 1.4rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar-option:hover { border-color: rgba(200,155,60,0.6); }
  .avatar-option.selected {
    border-color: var(--brass);
    background: rgba(200,155,60,0.12);
  }

  form.add-child { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; align-items: center; }

  select, input[type=text] {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1.5px solid rgba(22,35,61,0.2);
    font-family: var(--font-body);
    font-size: 0.95rem;
  }

  input[type=text] { flex: 1; min-width: 160px; }

  button.add-btn {
    background: var(--ink-navy);
    color: var(--parchment);
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--font-body);
  }

  #dash-message {
    margin-top: 14px;
    font-size: 0.9rem;
    padding: 10px;
    border-radius: 6px;
    display: none;
  }
  #dash-message.error { background: rgba(166,61,64,0.12); color: var(--clue-red); display: block; }
  #dash-message.success { background: rgba(47,93,80,0.12); color: var(--forest-teal); display: block; }
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <div class="logo">🕵️ Case Cracker Club</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="case.html">This Week's Case</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="casefiles.html">🗂️ Case Files</a>
      <button class="logout" onclick="logout()">Log Out</button>
    </div>
  </nav>

  <h1 id="greeting">Welcome back</h1>
  <p class="sub" id="parent-email">Loading your account...</p>

  <div class="case-banner" id="case-banner" style="display:none;">
    <div>
      <div class="case-label" id="case-label">THIS WEEK'S CASE</div>
      <h2><span class="badge-emoji" id="case-emoji"></span><span id="case-title"></span></h2>
    </div>
    <a href="case.html" id="case-solve-link" class="btn-solve">Solve Now →</a>
  </div>

  <div class="stats-row" id="stats-row" style="display:none;">
    <div class="stat-pill">
      <div class="stat-value" id="stat-detectives">0</div>
      <div class="stat-label">Detectives</div>
    </div>
    <div class="stat-pill">
      <div class="stat-value" id="stat-points">0</div>
      <div class="stat-label">Total Points</div>
    </div>
    <div class="stat-pill">
      <div class="stat-value" id="stat-solved">0</div>
      <div class="stat-label">Cases Solved</div>
    </div>
  </div>

  <div class="card">
    <h2>Your Kids' Detective Profiles</h2>
    <div id="children-list">
      <div class="empty-state">Loading...</div>
    </div>

    <form class="add-child" id="add-child-form" style="flex-direction: column; align-items: stretch;">
      <div>
        <label style="font-weight:700; font-size:0.9rem; display:block; margin-bottom:8px;">Choose an avatar</label>
        <div class="avatar-grid" id="avatar-grid"></div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <input type="text" id="codename-input" placeholder="Detective codename (e.g. Agent Marigold)" required>
        <button type="submit" class="add-btn">Add Profile</button>
      </div>
    </form>
    <div id="limit-message" style="display:none; margin-top:14px; padding:12px; background: rgba(200,155,60,0.12); border-radius:8px; color: var(--brass); font-weight:600; font-size:0.9rem;">
      You've reached the limit of 3 detective profiles per account.
    </div>
    <div id="dash-message"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://leqmwwaasqrigppyaboc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_bnJq86HNYfwmiVrDKsfs0g_VwQU6lx5";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let selectedAvatar = "🕵️";
  let children = [];
  let solvedCounts = {};

  const AVATAR_OPTIONS = ["🕵️", "🔍", "🧩", "🦉", "🦊", "🐺", "🦁", "🐧", "🦅", "🐬", "🐙", "🦝"];

  function renderAvatarGrid() {
    const grid = document.getElementById("avatar-grid");
    grid.innerHTML = AVATAR_OPTIONS.map(emoji => `
      <button type="button" class="avatar-option ${emoji === selectedAvatar ? 'selected' : ''}" data-emoji="${emoji}">${emoji}</button>
    `).join("");

    grid.querySelectorAll(".avatar-option").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedAvatar = btn.dataset.emoji;
        grid.querySelectorAll(".avatar-option").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });
  }

  function setGreeting() {
    const hour = new Date().getHours();
    let greeting = "Welcome back";
    if (hour < 12) greeting = "Good morning, Detective HQ";
    else if (hour < 18) greeting = "Good afternoon, Detective HQ";
    else greeting = "Good evening, Detective HQ";
    document.getElementById("greeting").textContent = greeting;
  }

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = "signup.html";
      return;
    }
    currentUser = session.user;
    document.getElementById("parent-email").textContent = "Signed in as " + currentUser.email;
    setGreeting();
    renderAvatarGrid();
    loadCaseBanner();
    loadChildren();
  }

  async function loadCaseBanner() {
    const today = new Date().toISOString().slice(0, 10);

    const investigationResult = await supabaseClient
      .from("mystery_cases")
      .select("title, badge_emoji")
      .lte("week_start_date", today)
      .order("week_start_date", { ascending: false })
      .limit(1)
      .single();

    if (investigationResult.data) {
      document.getElementById("case-label").textContent = "THIS WEEK'S INVESTIGATION";
      document.getElementById("case-emoji").textContent = investigationResult.data.badge_emoji || "🔎";
      document.getElementById("case-title").textContent = investigationResult.data.title;
      document.getElementById("case-solve-link").href = "investigation.html";
      document.getElementById("case-banner").style.display = "flex";
      return;
    }

    const { data, error } = await supabaseClient
      .from("cases")
      .select("title, badge_emoji")
      .lte("week_start_date", today)
      .order("week_start_date", { ascending: false })
      .limit(1)
      .single();

    if (error || !data) return;

    document.getElementById("case-label").textContent = "THIS WEEK'S CASE";
    document.getElementById("case-emoji").textContent = data.badge_emoji || "🔦";
    document.getElementById("case-title").textContent = data.title;
    document.getElementById("case-solve-link").href = "case.html";
    document.getElementById("case-banner").style.display = "flex";
  }

  async function loadChildren() {
    const listEl = document.getElementById("children-list");
    const { data, error } = await supabaseClient
      .from("children")
      .select("*")
      .order("created_at", { ascending: true });

    if (error) {
      listEl.innerHTML = '<div class="empty-state">Could not load profiles: ' + error.message + '</div>';
      return;
    }

    children = data || [];

    if (children.length === 0) {
      listEl.innerHTML = '<div class="empty-state">No detective profiles yet — add your first one below.</div>';
      toggleAddForm(true);
      return;
    }

    await loadSolvedCounts();
    renderChildrenList();
    renderStats();
    toggleAddForm(children.length < 3);
  }

  async function loadSolvedCounts() {
    const ids = children.map(c => c.id);
    const { data, error } = await supabaseClient
      .from("solved_cases")
      .select("child_id")
      .in("child_id", ids);

    solvedCounts = {};
    if (!error && data) {
      data.forEach(row => {
        solvedCounts[row.child_id] = (solvedCounts[row.child_id] || 0) + 1;
      });
    }
  }

  function renderStats() {
    const totalPoints = children.reduce((sum, c) => sum + (c.points || 0), 0);
    const totalSolved = Object.values(solvedCounts).reduce((sum, n) => sum + n, 0);
    document.getElementById("stat-detectives").textContent = children.length;
    document.getElementById("stat-points").textContent = totalPoints;
    document.getElementById("stat-solved").textContent = totalSolved;
    document.getElementById("stats-row").style.display = "flex";
  }

  function renderChildrenList() {
    const listEl = document.getElementById("children-list");

    listEl.innerHTML = `<div class="child-grid">` + children.map(child => `
      <div class="child-card">
        <div class="avatar">${renderChildAvatar(child, 58)}</div>
        <div class="child-info">
          <div class="codename">${escapeHtml(child.codename)}</div>
          <div class="child-stats">
            <span class="points-val">${child.points} pts</span>
            <span>·</span>
            <span>${solvedCounts[child.id] || 0} solved</span>
          </div>
        </div>
        <a href="avatar-creator.html?child=${child.id}" class="edit-btn">Edit</a>
      </div>
    `).join("") + `</div>`;
  }

  function toggleAddForm(show) {
    document.getElementById("add-child-form").style.display = show ? "flex" : "none";
    const limitMsg = document.getElementById("limit-message");
    limitMsg.style.display = show ? "none" : "block";
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById("add-child-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const codename = document.getElementById("codename-input").value.trim();
    const avatar = selectedAvatar;
    const messageEl = document.getElementById("dash-message");

    if (!codename) return;

    const { error } = await supabaseClient.from("children").insert({
      parent_id: currentUser.id,
      codename: codename,
      avatar_emoji: avatar
    });

    if (error) {
      messageEl.className = "error";
      messageEl.textContent = error.message;
    } else {
      messageEl.className = "success";
      messageEl.textContent = "Profile added!";
      document.getElementById("codename-input").value = "";
      selectedAvatar = "🕵️";
      renderAvatarGrid();
      loadChildren();
      setTimeout(() => { messageEl.style.display = "none"; }, 2000);
    }
  });

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "index.html";
  }

  init();
</script>

</body>
</html>
