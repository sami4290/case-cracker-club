<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Sign Up — Case Cracker Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink-navy: #16233D;
    --parchment: #F3E9D2;
    --parchment-dim: #E9DBB8;
    --brass: #C89B3C;
    --clue-red: #A63D40;
    --font-display: 'Special Elite', monospace;
    --font-body: 'Quicksand', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--parchment);
    color: var(--ink-navy);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--ink-navy);
    color: var(--parchment);
    border-radius: 14px;
    padding: 44px;
    max-width: 420px;
    width: 100%;
  }
  .badge {
    font-family: var(--font-display);
    color: var(--brass);
    font-size: 0.9rem;
    margin-bottom: 8px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    margin-bottom: 24px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    background: rgba(243,233,210,0.08);
    border: 1px solid rgba(243,233,210,0.15);
  }
  .tab.active {
    background: var(--brass);
    color: var(--ink-navy);
  }
  label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 6px;
    color: var(--parchment-dim);
  }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(243,233,210,0.25);
    background: rgba(243,233,210,0.06);
    color: var(--parchment);
    font-family: var(--font-body);
    font-size: 1rem;
    margin-bottom: 18px;
  }
  input::placeholder { color: rgba(243,233,210,0.4); }
  button.submit {
    width: 100%;
    background: var(--brass);
    color: var(--ink-navy);
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  #message {
    margin-top: 16px;
    font-size: 0.9rem;
    padding: 10px;
    border-radius: 6px;
    display: none;
  }
  #message.error { background: rgba(166,61,64,0.25); color: #F3C9CA; display: block; }
  #message.success { background: rgba(47,93,80,0.3); color: #BFE3D6; display: block; }
  .back {
    display: inline-block;
    margin-top: 20px;
    color: var(--parchment-dim);
    font-size: 0.85rem;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="card">
  <div class="badge">CASE CRACKER CLUB</div>
  <h1 id="heading">Create Your Parent Account</h1>

  <div class="tabs">
    <div class="tab active" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
    <div class="tab" id="tab-login" onclick="switchTab('login')">Log In</div>
  </div>

  <form id="auth-form">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" required>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">

    <button type="submit" class="submit" id="submit-btn">Create Account</button>
  </form>

  <div id="message"></div>

  <a href="index.html" class="back">← Back to homepage</a>
</div>

<script>
  const SUPABASE_URL = "https://leqmwwaasqrigppyaboc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_bnJq86HNYfwmiVrDKsfs0g_VwQU6lx5";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let mode = "signup";

  function switchTab(newMode) {
    mode = newMode;
    document.getElementById("tab-signup").classList.toggle("active", mode === "signup");
    document.getElementById("tab-login").classList.toggle("active", mode === "login");
    document.getElementById("heading").textContent = mode === "signup" ? "Create Your Parent Account" : "Welcome Back";
    document.getElementById("submit-btn").textContent = mode === "signup" ? "Create Account" : "Log In";
    document.getElementById("message").style.display = "none";
  }

  document.getElementById("auth-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submit-btn");

    submitBtn.disabled = true;
    submitBtn.textContent = "Please wait...";

    let result;
    if (mode === "signup") {
      result = await supabase.auth.signUp({ email, password });
    } else {
      result = await supabase.auth.signInWithPassword({ email, password });
    }

    submitBtn.disabled = false;
    submitBtn.textContent = mode === "signup" ? "Create Account" : "Log In";

    if (result.error) {
      messageEl.className = "error";
      messageEl.textContent = result.error.message;
    } else {
      messageEl.className = "success";
      if (mode === "signup") {
        messageEl.textContent = "Account created! Redirecting...";
      } else {
        messageEl.textContent = "Logged in! Redirecting...";
      }
      setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
    }
  });
</script>

</body>
</html>
