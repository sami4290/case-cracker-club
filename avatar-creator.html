<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Detective — Case Cracker Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="avatar-render.js?v=4"></script>
<style>
  :root {
    --ink-navy: #16233D;
    --parchment: #F3E9D2;
    --parchment-dim: #E9DBB8;
    --brass: #C89B3C;
    --brass-light: #E0BC6C;
    --clue-red: #A63D40;
    --forest-teal: #2F5D50;
    --font-display: 'Special Elite', monospace;
    --font-body: 'Quicksand', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--parchment);
    color: var(--ink-navy);
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }
  .logo { font-family: var(--font-display); font-size: 1.1rem; }
  .back-link { color: var(--ink-navy); font-size: 0.9rem; text-decoration: none; font-weight: 600; }

  h1 { font-family: var(--font-display); font-size: 1.5rem; margin-bottom: 6px; }
  .credit { font-size: 0.78rem; color: #6B7690; margin-bottom: 20px; }
  .credit a { color: #6B7690; }

  .preview-panel {
    background: var(--ink-navy);
    border-radius: 14px;
    padding: 28px;
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 24px;
  }
  .preview-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: var(--parchment-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    border: 3px solid var(--brass);
  }
  .preview-circle div, .preview-circle img { width: 100%; height: 100%; }
  .preview-info { color: var(--parchment); flex: 1; }
  .preview-info label {
    display: block;
    font-size: 0.85rem;
    color: var(--parchment-dim);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .preview-info input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(243,233,210,0.25);
    background: rgba(243,233,210,0.08);
    color: var(--parchment);
    font-family: var(--font-body);
    font-size: 1rem;
  }

  .starter-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .starter-btn {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(22,35,61,0.15);
    background: var(--parchment);
    cursor: pointer;
    overflow: hidden;
    padding: 0;
  }
  .starter-btn div, .starter-btn img { width: 100%; height: 100%; }
  .starter-btn.selected { border-color: var(--brass); border-width: 3px; }

  .step-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .step-progress {
    font-size: 0.8rem;
    color: #6B7690;
    font-weight: 600;
  }

  .nav-bar {
    position: sticky;
    bottom: 0;
    background: var(--parchment);
    padding: 16px 0;
    display: flex;
    gap: 12px;
  }
  .nav-btn {
    padding: 14px 26px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.98rem;
    border: none;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .nav-btn-primary { background: var(--brass); color: var(--ink-navy); flex: 1; }
  .nav-btn-secondary { background: transparent; color: var(--ink-navy); border: 1.5px solid rgba(22,35,61,0.2); }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .category {
    background: white;
    border: 1.5px solid rgba(22,35,61,0.12);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .category h3 {
    font-family: var(--font-display);
    font-size: 0.95rem;
    margin-bottom: 14px;
  }
  .option-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .option-btn {
    flex-shrink: 0;
    width: 58px;
    height: 58px;
    border-radius: 10px;
    border: 2px solid rgba(22,35,61,0.15);
    background: var(--parchment);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 0;
  }
  .option-btn div, .option-btn img { width: 100%; height: 100%; }
  .option-btn.selected { border-color: var(--brass); background: rgba(200,155,60,0.12); }

  .swatch-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    padding: 0;
  }
  .swatch-btn.selected { border-color: var(--brass); }

  .save-bar {
    position: sticky;
    bottom: 0;
    background: var(--parchment);
    padding: 16px 0;
    display: flex;
    gap: 12px;
  }
  .btn {
    padding: 14px 26px;
    border-radius: 8px;
    font-weight: 700;
    text-decoration: none;
    font-size: 0.98rem;
    border: none;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .btn-primary { background: var(--brass); color: var(--ink-navy); flex: 1; }
  .btn-secondary { background: transparent; color: var(--ink-navy); border: 1.5px solid rgba(22,35,61,0.2); }

  #save-message {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    display: none;
    font-weight: 600;
    font-size: 0.9rem;
  }
  #save-message.error { background: rgba(166,61,64,0.12); color: var(--clue-red); display: block; }
  #save-message.success { background: rgba(47,93,80,0.12); color: var(--forest-teal); display: block; }

  .loading-state { text-align: center; padding: 60px 0; color: #6B7690; }
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <div class="logo">🕵️ Case Cracker Club</div>
    <a href="dashboard.html" class="back-link">← Dashboard</a>
  </nav>

  <div id="page-content">
    <div class="loading-state">Loading detective profile...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://leqmwwaasqrigppyaboc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_bnJq86HNYfwmiVrDKsfs0g_VwQU6lx5";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CATEGORIES = [
    { key: "skinColor", label: "Skin Tone", options: SKIN_COLORS, type: "color" },
    { key: "hair", label: "Hair Style", options: HAIR_STYLES, type: "avatar" },
    { key: "hairColor", label: "Hair Color", options: HAIR_COLORS, type: "color" },
    { key: "eyebrows", label: "Eyebrows", options: EYEBROW_STYLES, type: "avatar" },
    { key: "eyes", label: "Eyes", options: EYE_STYLES, type: "avatar" },
    { key: "mouth", label: "Mouth", options: MOUTH_STYLES, type: "avatar" },
    { key: "glasses", label: "Glasses", options: GLASSES_STYLES, type: "avatar" },
    { key: "earrings", label: "Earrings", options: EARRING_STYLES, type: "avatar" },
    { key: "details", label: "Extra Detail", options: DETAIL_STYLES, type: "avatar" }
  ];

  const STEPS = [
    { type: "starter", label: "Quick Start Looks" },
    ...CATEGORIES.map(cat => ({ type: cat.type, label: cat.label, key: cat.key, options: cat.options }))
  ];

  let currentUser = null;
  let childId = null;
  let child = null;
  let config = Object.assign({}, DEFAULT_AVATAR_CONFIG);
  let stepIndex = 0;

  function getChildIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("child");
  }

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = "signup.html";
      return;
    }
    currentUser = session.user;

    childId = getChildIdFromUrl();
    if (!childId) {
      document.getElementById("page-content").innerHTML = '<div class="loading-state">No detective selected. <a href="dashboard.html">Go back</a></div>';
      return;
    }

    const { data, error } = await supabaseClient
      .from("children")
      .select("*")
      .eq("id", childId)
      .single();

    if (error || !data || data.parent_id !== currentUser.id) {
      document.getElementById("page-content").innerHTML = '<div class="loading-state">Could not load this profile. <a href="dashboard.html">Go back</a></div>';
      return;
    }

    child = data;
    const existingConfig = parseAvatarConfig(child.avatar_config);
    config = existingConfig ? Object.assign({}, DEFAULT_AVATAR_CONFIG, existingConfig) : Object.assign({}, DEFAULT_AVATAR_CONFIG);

    renderPage();
  }

  function renderPage() {
    const content = document.getElementById("page-content");
    content.innerHTML = `
      <h1>Create Your Detective</h1>
      <div class="credit">Avatar art: "Adventurer" by Lisa Wischofsky, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a>, via DiceBear</div>

      <div class="preview-panel">
        <div class="preview-circle" id="preview-circle"></div>
        <div class="preview-info">
          <label for="codename-input">Detective codename</label>
          <input type="text" id="codename-input" value="${escapeHtml(child.codename)}">
        </div>
      </div>

      <div class="category" id="step-panel"></div>

      <div class="nav-bar">
        <button class="nav-btn nav-btn-secondary" id="back-btn">Back</button>
        <button class="nav-btn nav-btn-primary" id="next-btn">Next</button>
      </div>
      <div id="save-message"></div>
      <div style="margin-top:10px;"><a href="dashboard.html" style="font-size:0.85rem; color:#6B7690;">Cancel and return to dashboard</a></div>
    `;

    renderPreview();
    renderStep();

    document.getElementById("back-btn").addEventListener("click", () => {
      if (stepIndex > 0) {
        stepIndex--;
        renderStep();
      }
    });

    document.getElementById("next-btn").addEventListener("click", () => {
      if (stepIndex < STEPS.length - 1) {
        stepIndex++;
        renderStep();
      } else {
        saveProfile();
      }
    });
  }

  function renderStep() {
    const step = STEPS[stepIndex];
    const panel = document.getElementById("step-panel");

    panel.innerHTML = `
      <div class="step-header">
        <h3>${step.label}</h3>
        <span class="step-progress">Step ${stepIndex + 1} of ${STEPS.length}</span>
      </div>
      <div class="${step.type === 'starter' ? 'starter-row' : 'option-row'}" id="step-options"></div>
    `;

    if (step.type === "starter") {
      renderStarterOptions();
    } else {
      renderCategoryOptions(step);
    }

    const backBtn = document.getElementById("back-btn");
    const nextBtn = document.getElementById("next-btn");
    backBtn.disabled = stepIndex === 0;
    nextBtn.textContent = stepIndex === STEPS.length - 1 ? "Save Detective" : "Next";
  }

  function renderStarterOptions() {
    const row = document.getElementById("step-options");
    row.innerHTML = STARTER_LOOKS.map((look, i) => {
      const url = buildAvatarUrl(look, 64);
      return `<button type="button" class="starter-btn" data-index="${i}" title="Look ${i + 1}"><img src="${url}" alt="Look ${i + 1}"></button>`;
    }).join("");

    row.querySelectorAll(".starter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        config = Object.assign({}, DEFAULT_AVATAR_CONFIG, STARTER_LOOKS[Number(btn.dataset.index)]);
        renderPreview();
        renderStarterOptions();
      });
    });
  }

  function renderPreview() {
    const url = buildAvatarUrl(config, 200);
    document.getElementById("preview-circle").innerHTML = `<img src="${url}" alt="preview">`;
  }

  function renderCategoryOptions(cat) {
    const row = document.getElementById("step-options");

    if (cat.type === "color") {
      row.innerHTML = cat.options.map(opt => {
        const isSelected = config[cat.key] === opt.id;
        return `<button type="button" class="swatch-btn ${isSelected ? 'selected' : ''}" data-key="${cat.key}" data-id="${opt.id}" title="${opt.label}" style="background:#${opt.id};"></button>`;
      }).join("");
    } else {
      row.innerHTML = cat.options.map(opt => {
        const previewConfig = Object.assign({}, config, { [cat.key]: opt.id });
        const isSelected = config[cat.key] === opt.id;
        const url = buildAvatarUrl(previewConfig, 58);
        return `<button type="button" class="option-btn ${isSelected ? 'selected' : ''}" data-key="${cat.key}" data-id="${opt.id}" title="${opt.label}"><img src="${url}" alt="${opt.label}"></button>`;
      }).join("");
    }

    row.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        config[btn.dataset.key] = btn.dataset.id;
        renderPreview();
        renderCategoryOptions(cat);
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  async function saveProfile() {
    const codename = document.getElementById("codename-input").value.trim();
    const messageEl = document.getElementById("save-message");

    if (!codename) return;

    const { error } = await supabaseClient
      .from("children")
      .update({
        codename: codename,
        avatar_config: config,
        avatar_emoji: "🕵️"
      })
      .eq("id", childId);

    if (error) {
      messageEl.className = "error";
      messageEl.textContent = error.message;
      return;
    }

    messageEl.className = "success";
    messageEl.textContent = "Saved! Heading back to your dashboard...";
    setTimeout(() => { window.location.href = "dashboard.html"; }, 900);
  }

  init();
</script>

</body>
</html>
