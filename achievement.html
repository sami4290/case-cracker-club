<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Closed! — Case Cracker Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-navy: #16233D;
    --parchment: #F3E9D2;
    --parchment-dim: #E9DBB8;
    --brass: #C89B3C;
    --brass-light: #E0BC6C;
    --clue-red: #A63D40;
    --forest-teal: #2F5D50;
    --font-display: 'Special Elite', monospace;
    --font-body: 'Quicksand', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--ink-navy);
    color: var(--parchment);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* decorative confetti dots */
  .confetti {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: pop 0.6s ease forwards;
  }
  @keyframes pop {
    0% { opacity: 0; transform: scale(0) translateY(0); }
    60% { opacity: 1; }
    100% { opacity: 0.85; transform: scale(1) translateY(0); }
  }

  .wrap {
    max-width: 560px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .stamp {
    display: inline-block;
    font-family: var(--font-display);
    color: var(--clue-red);
    border: 3px solid var(--clue-red);
    padding: 8px 22px;
    border-radius: 6px;
    font-size: 1rem;
    letter-spacing: 2px;
    transform: rotate(-6deg) scale(0.5);
    opacity: 0;
    margin-bottom: 20px;
    animation: stamp-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
  }
  @keyframes stamp-in {
    to { transform: rotate(-6deg) scale(1); opacity: 1; }
  }

  .badge-emoji {
    font-size: 4.5rem;
    margin-bottom: 8px;
    transform: scale(0);
    animation: badge-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards;
  }
  @keyframes badge-in {
    to { transform: scale(1); }
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    margin-bottom: 24px;
    line-height: 1.3;
    opacity: 0;
    animation: fade-up 0.5s ease 0.5s forwards;
  }

  .story-panel {
    background: rgba(243,233,210,0.06);
    border: 1px solid rgba(200,155,60,0.3);
    border-left: 4px solid var(--forest-teal);
    border-radius: 8px;
    padding: 24px 26px;
    text-align: left;
    line-height: 1.75;
    font-size: 1.02rem;
    color: var(--parchment-dim);
    margin-bottom: 28px;
    opacity: 0;
    animation: fade-up 0.5s ease 0.7s forwards;
  }

  .points-banner {
    background: var(--brass);
    color: var(--ink-navy);
    border-radius: 10px;
    padding: 18px;
    font-family: var(--font-display);
    font-size: 1.15rem;
    margin-bottom: 32px;
    opacity: 0;
    animation: fade-up 0.5s ease 0.9s forwards;
  }
  .points-banner .sub {
    display: block;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.85rem;
    margin-top: 4px;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .actions {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    opacity: 0;
    animation: fade-up 0.5s ease 1.1s forwards;
  }

  .btn {
    padding: 14px 26px;
    border-radius: 8px;
    font-weight: 700;
    text-decoration: none;
    font-size: 0.98rem;
  }
  .btn-primary { background: var(--brass); color: var(--ink-navy); }
  .btn-secondary { background: transparent; color: var(--parchment); border: 1.5px solid rgba(243,233,210,0.3); }

  .fallback {
    text-align: center;
  }
  .fallback a { color: var(--brass-light); }
</style>
</head>
<body>

<div class="wrap" id="content">
  <!-- populated by script -->
</div>

<script>
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function spawnConfetti() {
    const colors = ["#C89B3C", "#A63D40", "#2F5D50", "#E0BC6C"];
    for (let i = 0; i < 24; i++) {
      const dot = document.createElement("div");
      dot.className = "confetti";
      const size = 6 + Math.random() * 8;
      dot.style.width = size + "px";
      dot.style.height = size + "px";
      dot.style.background = colors[Math.floor(Math.random() * colors.length)];
      dot.style.left = Math.random() * 100 + "vw";
      dot.style.top = (10 + Math.random() * 50) + "vh";
      dot.style.animationDelay = (Math.random() * 0.8) + "s";
      document.body.appendChild(dot);
    }
  }

  function render() {
    const raw = sessionStorage.getItem("caseAchievement");
    const container = document.getElementById("content");

    if (!raw) {
      container.innerHTML = `
        <div class="fallback">
          <h1>No case result found</h1>
          <p style="margin-top:16px; color: var(--parchment-dim);">
            Head back and solve this week's case to see your achievement here.
          </p>
          <div class="actions" style="opacity:1; margin-top:24px;">
            <a href="case.html" class="btn btn-primary">Go to This Week's Case</a>
          </div>
        </div>
      `;
      return;
    }

    const data = JSON.parse(raw);
    sessionStorage.removeItem("caseAchievement");

    container.innerHTML = `
      <div class="badge-emoji">${data.badge}</div>
      <div class="stamp">${data.alreadySolved ? "CASE REVIEWED" : "CASE CLOSED"}</div>
      <h1>${escapeHtml(data.title)}</h1>
      <div class="story-panel">${escapeHtml(data.resolution)}</div>
      <div class="points-banner">
        ${data.alreadySolved
          ? `${escapeHtml(data.codename)} already cracked this one`
          : `+${data.points} POINTS`}
        <span class="sub">${data.alreadySolved ? "Nice work reviewing the case" : escapeHtml(data.codename) + " earned this badge"}</span>
      </div>
      <div class="actions">
        <a href="leaderboard.html" class="btn btn-primary">See the Leaderboard</a>
        <a href="dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
      </div>
    `;

    if (!data.alreadySolved) spawnConfetti();
  }

  render();
</script>

</body>
</html>
